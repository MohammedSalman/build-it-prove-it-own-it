<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AfterHours Festival</title>
<style>
  :root {
    --night: #14112a;
    --panel: #1f1a3d;
    --line: #342c63;
    --text: #f3f0ff;
    --muted: #b3aad9;
    --glow: #ffb547;
    --full: #ff6b8b;
    --ok: #5fe0b0;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1200px 600px at 80% -10%, #3a2470 0%, transparent 60%), var(--night);
    color: var(--text);
    min-height: 100vh;
  }
  main { max-width: 880px; margin: 0 auto; padding: 32px 16px 64px; }
  header h1 { font-size: clamp(2rem, 6vw, 3.2rem); margin: 0; letter-spacing: -0.02em; }
  header h1 span { color: var(--glow); }
  header p { color: var(--muted); margin: 4px 0 24px; }
  .who { display: flex; gap: 8px; align-items: center; margin-bottom: 24px; flex-wrap: wrap; }
  .who label { color: var(--muted); }
  .who input {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px 12px; font: inherit; min-width: 0; flex: 1 1 200px; max-width: 320px;
  }
  .who button { grid-row: auto; grid-column: auto; }
  .who .me { color: var(--muted); }
  .who .me strong { color: var(--text); }
  h2.section { font-size: 1rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 28px 0 10px; }
  .mine { list-style: none; padding: 0; margin: 0 0 8px; display: grid; gap: 8px; }
  .mine li { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px;
             display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .mine button { grid-row: auto; grid-column: auto; padding: 6px 12px; background: var(--line); color: var(--text); }
  .events { display: grid; gap: 14px; }
  .event {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 18px; display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; align-items: center;
  }
  .event h2 { margin: 0; font-size: 1.15rem; }
  .meta { color: var(--muted); font-size: 0.92rem; }
  .meter { grid-column: 1 / -1; height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--glow); }
  .left { font-variant-numeric: tabular-nums; font-size: 0.92rem; }
  .left.last { color: var(--glow); font-weight: 600; }
  .left.none { color: var(--full); }
  button {
    font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 10px 18px;
    background: var(--glow); color: #2a1a00; cursor: pointer; grid-row: 1 / span 2; grid-column: 2;
  }
  button:disabled { background: var(--line); color: var(--muted); cursor: not-allowed; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--ok); outline-offset: 2px; }
  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--ok); color: #062a1d; padding: 12px 18px; border-radius: 12px;
    font-weight: 600; max-width: calc(100% - 32px);
  }
  #toast.bad { background: var(--full); color: #3a0010; }
</style>
</head>
<body>
<main>
  <header>
    <h1>After<span>Hours</span> Festival</h1>
    <p>Three nights of games, music and making. Places are limited.</p>
  </header>

  <form class="who" id="signin">
    <label for="name">Name</label>
    <input id="name" autocomplete="username" placeholder="e.g. Maya">
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password">
    <button type="submit">Sign in</button>
  </form>
  <div class="who" id="signedin" hidden>
    <span class="me">Signed in as <strong id="myname"></strong></span>
    <button type="button" id="signout">Sign out</button>
  </div>

  <section id="minebox" hidden>
    <h2 class="section">My reservations</h2>
    <ul class="mine" id="mine"></ul>
  </section>

  <h2 class="section">Programme</h2>
  <section class="events" id="events" aria-live="polite"></section>
</main>
<div id="toast" role="status" hidden></div>

<script>
const eventsEl = document.getElementById("events");
const toastEl = document.getElementById("toast");
const mineEl = document.getElementById("mine");

// The token proves who you are. It lives in this tab only (sessionStorage).
let token = sessionStorage.getItem("token");
const auth = () => (token ? { Authorization: `Bearer ${token}` } : {});

function when(iso) {
  const d = new Date(iso);
  return d.toLocaleString(undefined, { weekday: "short", hour: "2-digit", minute: "2-digit" });
}

function toast(text, bad = false) {
  toastEl.textContent = text;
  toastEl.className = bad ? "bad" : "";
  toastEl.hidden = false;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => (toastEl.hidden = true), 3500);
}

async function load() {
  const events = await (await fetch("/api/events")).json();
  eventsEl.replaceChildren(...events.map(render));
  const me = token ? await fetch("/api/me", { headers: auth() }) : null;
  const signedIn = me !== null && me.ok;
  if (!signedIn) { token = null; sessionStorage.removeItem("token"); }
  document.getElementById("signin").hidden = signedIn;
  document.getElementById("signedin").hidden = !signedIn;
  document.getElementById("minebox").hidden = !signedIn;
  if (signedIn) {
    document.getElementById("myname").textContent = (await me.json()).name;
    const mine = await (await fetch("/api/me/reservations", { headers: auth() })).json();
    mineEl.replaceChildren(...mine.map(renderMine));
    if (!mine.length) mineEl.innerHTML = "<li>None yet.</li>";
  }
}

function renderMine(r) {
  const li = document.createElement("li");
  li.innerHTML = `<span></span><button type="button">Cancel</button>`;
  li.querySelector("span").textContent = `#${r.id} · ${r.title} · ${when(r.starts_at)}`;
  li.querySelector("button").addEventListener("click", () => cancel(r));
  return li;
}

async function cancel(r) {
  const res = await fetch(`/api/reservations/${r.id}`, { method: "DELETE", headers: auth() });
  toast(res.status === 204 ? `Cancelled #${r.id}.` : "Could not cancel that.", res.status !== 204);
  await load();
}

document.getElementById("signin").addEventListener("submit", async (e) => {
  e.preventDefault();
  const res = await fetch("/api/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name: document.getElementById("name").value.trim(),
                           password: document.getElementById("password").value }),
  });
  if (!res.ok) { toast("Wrong name or password.", true); return; }
  token = (await res.json()).token;
  sessionStorage.setItem("token", token);
  document.getElementById("password").value = "";
  await load();
});

document.getElementById("signout").addEventListener("click", async () => {
  await fetch("/api/logout", { method: "POST", headers: auth() });
  token = null;
  sessionStorage.removeItem("token");
  await load();
});

function render(ev) {
  const card = document.createElement("article");
  card.className = "event";
  const left = ev.places_left;
  const leftText = left <= 0 ? "Full" : left === 1 ? "1 place left!" : `${left} places left`;
  const leftClass = left <= 0 ? "none" : left === 1 ? "last" : "";
  const pct = Math.min(100, Math.round((ev.reserved / ev.capacity) * 100));
  card.innerHTML = `
    <h2></h2>
    <div class="meta"></div>
    <div class="left ${leftClass}">${leftText}</div>
    <div class="meter" aria-hidden="true"><i style="width:${pct}%"></i></div>
    <button type="button">Reserve</button>`;
  card.querySelector("h2").textContent = ev.title;
  card.querySelector(".meta").textContent = `${when(ev.starts_at)} · ${ev.venue}`;
  const button = card.querySelector("button");
  button.disabled = left <= 0;
  button.addEventListener("click", () => reserve(ev, button));
  return card;
}

async function reserve(ev, button) {
  if (!token) {
    toast("Sign in first, then press Reserve.", true);
    document.getElementById("name").focus();
    return;
  }
  const res = await fetch(`/api/events/${ev.id}/reservations`, { method: "POST", headers: auth() });
  if (res.status === 201) {
    const r = await res.json();
    toast(`You're in! Reservation #${r.id} for ${ev.title}.`);
  } else if (res.status === 409) {
    toast("Sorry, that event just filled up.", true);
  } else {
    toast("Something went wrong. Please try again.", true);
  }
  await load();
}

load();
</script>
</body>
</html>
